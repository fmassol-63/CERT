services:
  # Sert uniquement les fichiers de validation ACME
  # (/.well-known/acme-challenge/...) que HAProxy doit lui relayer.
  acme-challenge:
    image: nginx:alpine
    container_name: cert-acme-challenge
    restart: unless-stopped
    ports:
      - "${ACME_HTTP_PORT:-8080}:80"
    volumes:
      - acme_webroot:/usr/share/nginx/html:ro
    networks:
      - cert-net

  # Obtient puis renouvelle automatiquement les certificats Let's Encrypt
  # (methode webroot), et genere un .pem combine (cert+cle) pret a etre
  # charge par HAProxy.
  certbot:
    image: certbot/certbot:latest
    container_name: cert-certbot
    restart: unless-stopped
    entrypoint: ["/scripts/entrypoint.sh"]
    environment:
      - DOMAINS=${DOMAINS}
      - ACME_EMAIL=${ACME_EMAIL}
      - STAGING=${STAGING:-false}
    volumes:
      - acme_webroot:/var/www/acme-challenge
      - letsencrypt:/etc/letsencrypt
      - ./scripts/entrypoint.sh:/scripts/entrypoint.sh:ro
      - ./scripts/concat-cert.sh:/etc/letsencrypt/renewal-hooks/deploy/concat-cert.sh:ro
      - ./output:/output
    networks:
      - cert-net

networks:
  cert-net:
    name: cert-net
    driver: bridge

volumes:
  acme_webroot:
  letsencrypt:
